<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Gesture Particle Simulation</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: black;
        font-family: sans-serif;
        touch-action: none;
      }

      /* MAIN PARTICLE CANVAS */
      #canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
      }

      /* CAMERA CONTAINER - Responsive */
      #camera-box {
        position: fixed;
        bottom: 10px;
        right: 10px;
        width: min(220px, 30vw);
        height: min(160px, 22vw);
        border-radius: clamp(6px, 2vw, 12px);
        overflow: hidden;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
        border: 2px solid rgba(255, 255, 255, 0.6);
        background: black;
        z-index: 5;
      }

      /* Hide camera on very small screens */
      @media (max-width: 480px) {
        #camera-box {
          width: 120px;
          height: 90px;
          bottom: 5px;
          right: 5px;
        }
      }

      #camera-box video,
      #camera-box canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1); /* mirror selfie */
      }

      #info {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 10;
        color: white;
        background: rgba(0, 0, 0, 0.4);
        padding: clamp(4px, 1.5vw, 8px) clamp(6px, 2vw, 12px);
        border-radius: 6px;
        font-size: clamp(10px, 2.5vw, 14px);
      }

      @media (max-width: 480px) {
        #info {
          top: 5px;
          left: 5px;
          padding: 4px 8px;
          font-size: 10px;
        }
      }

      /* INSTRUCTIONS PANEL */
      #instructions {
        position: fixed;
        bottom: 10px;
        left: 10px;
        z-index: 10;
        color: white;
        background: rgba(0, 0, 0, 0.5);
        padding: clamp(8px, 2vw, 15px);
        border-radius: 8px;
        font-size: clamp(10px, 2vw, 14px);
        max-width: clamp(200px, 40vw, 350px);
        line-height: 1.4;
      }

      #instructions h3 {
        margin: 0 0 8px 0;
        font-size: clamp(12px, 2.5vw, 16px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        padding-bottom: 5px;
      }

      #instructions ul {
        margin: 0;
        padding-left: 18px;
      }

      #instructions li {
        margin-bottom: 4px;
      }

      #instructions .gesture-icon {
        display: inline-block;
        width: clamp(18px, 4vw, 24px);
        text-align: center;
        margin-right: 5px;
      }

      @media (max-width: 480px) {
        #instructions {
          bottom: 5px;
          left: 5px;
          padding: 6px 10px;
          max-width: 180px;
          font-size: 9px;
        }

        #instructions h3 {
          font-size: 11px;
          margin-bottom: 5px;
        }

        #instructions ul {
          padding-left: 12px;
        }

        #instructions li {
          margin-bottom: 2px;
        }
      }

      /* Hide instructions on very small height screens (landscape mobile) */
      @media (max-height: 500px) {
        #instructions {
          display: none;
        }
      }

      /* TEXT INPUT - Always visible */
      #text-input-container {
        position: fixed;
        top: 10px;
        right: 10px;
        z-index: 15;
      }

      #custom-text-input {
        padding: clamp(6px, 1.5vw, 10px) clamp(10px, 2vw, 15px);
        font-size: clamp(12px, 2.5vw, 16px);
        border: 2px solid rgba(255, 255, 255, 0.6);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.6);
        color: white;
        width: clamp(150px, 30vw, 250px);
        outline: none;
      }

      #custom-text-input::placeholder {
        color: rgba(255, 255, 255, 0.5);
      }

      #custom-text-input:focus {
        border-color: #00bfff;
        box-shadow: 0 0 10px rgba(0, 191, 255, 0.5);
      }

      #char-count {
        color: rgba(255, 255, 255, 0.7);
        font-size: clamp(9px, 2vw, 12px);
        margin-top: 4px;
        text-align: right;
      }

      @media (max-width: 480px) {
        #text-input-container {
          top: auto;
          bottom: 100px;
          right: 5px;
        }

        #custom-text-input {
          width: 140px;
          padding: 5px 8px;
          font-size: 11px;
        }
      }

      /* LOADING SCREEN */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(
          135deg,
          #0a0a1a 0%,
          #1a0a2e 50%,
          #0a1a2e 100%
        );
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }

      #loading-screen.hidden {
        opacity: 0;
        visibility: hidden;
      }

      .loading-title {
        font-size: clamp(24px, 6vw, 48px);
        color: white;
        margin-bottom: 20px;
        text-align: center;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
      }

      .loading-emoji {
        font-size: clamp(40px, 10vw, 80px);
        margin-bottom: 30px;
        animation: bounce 1s ease-in-out infinite;
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-15px);
        }
      }

      .loading-spinner {
        width: clamp(50px, 12vw, 80px);
        height: clamp(50px, 12vw, 80px);
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top: 4px solid #00bfff;
        border-right: 4px solid #ff6b9d;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 25px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .loading-text {
        color: rgba(255, 255, 255, 0.8);
        font-size: clamp(12px, 3vw, 18px);
        margin-bottom: 10px;
      }

      .loading-progress {
        width: clamp(200px, 60vw, 300px);
        height: 6px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 3px;
        overflow: hidden;
        margin-top: 15px;
      }

      .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #00bfff, #ff6b9d, #ffd700);
        border-radius: 3px;
        transition: width 0.3s ease;
      }

      .loading-status {
        color: rgba(255, 255, 255, 0.6);
        font-size: clamp(10px, 2.5vw, 14px);
        margin-top: 15px;
        text-align: center;
      }

      /* HAND TRACKING TOGGLE BUTTON */
      #hand-toggle-container {
        position: fixed;
        top: 50px;
        left: 10px;
        z-index: 15;
        display: none; /* Only show on mobile */
      }

      @media (max-width: 768px) {
        #hand-toggle-container {
          display: block;
        }
      }

      #hand-toggle-btn {
        padding: 8px 12px;
        font-size: 12px;
        border: 2px solid rgba(255, 255, 255, 0.6);
        border-radius: 20px;
        background: rgba(0, 0, 0, 0.6);
        color: white;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: all 0.3s ease;
      }

      #hand-toggle-btn:hover {
        background: rgba(0, 191, 255, 0.3);
        border-color: #00bfff;
      }

      #hand-toggle-btn.active {
        background: rgba(0, 191, 255, 0.4);
        border-color: #00bfff;
        box-shadow: 0 0 10px rgba(0, 191, 255, 0.5);
      }

      #hand-toggle-btn .toggle-icon {
        font-size: 16px;
      }

      #hand-toggle-btn .toggle-text {
        font-size: 11px;
      }

      #hand-toggle-btn.loading {
        opacity: 0.6;
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <!-- LOADING SCREEN -->
    <div id="loading-screen">
      <div class="loading-emoji">🎆</div>
      <div class="loading-title">Happy New Year 2026</div>
      <div class="loading-spinner"></div>
      <div class="loading-text">Memuat...</div>
      <div class="loading-progress">
        <div class="loading-progress-bar" id="progress-bar"></div>
      </div>
      <div class="loading-status" id="loading-status">
        Menyiapkan aplikasi...
      </div>
    </div>

    <div id="info">
      <div id="gesture">Gesture: -</div>
      <div id="state">State: SPHERE</div>
    </div>

    <!-- HAND TRACKING TOGGLE (Mobile only) -->
    <div id="hand-toggle-container">
      <button id="hand-toggle-btn">
        <span class="toggle-icon">🖐️</span>
        <span class="toggle-text">Hand Tracking: OFF</span>
      </button>
    </div>

    <!-- INSTRUCTIONS -->
    <div id="instructions">
      <h3>🎆 Instruksi Gesture</h3>
      <ul>
        <li><span class="gesture-icon">👋</span> Tanpa Tangan → Bola</li>
        <li><span class="gesture-icon">✊</span> Tutup → Text Custom</li>
        <li><span class="gesture-icon">☝️</span> 1 Jari → Bintang</li>
        <li><span class="gesture-icon">✌️</span> 2 Jari → Love</li>
        <li><span class="gesture-icon">🤟</span> 3 Jari → Happy New Year</li>
        <li><span class="gesture-icon">🖐️</span> Terbuka → Kembang Api</li>
      </ul>
      <p style="margin: 8px 0 0 0; font-size: 0.9em; opacity: 0.8">
        Tangan kiri: Pinch untuk zoom
      </p>
    </div>

    <!-- TEXT INPUT FOR CUSTOM TEXT -->
    <div id="text-input-container">
      <input
        type="text"
        id="custom-text-input"
        maxlength="20"
        placeholder="Ketik text (max 20)"
      />
      <div id="char-count">0/20</div>
    </div>

    <!-- PARTICLE VISUAL -->
    <canvas id="canvas"></canvas>

    <!-- CAMERA + DEBUG -->
    <div id="camera-box">
      <video id="video" autoplay playsinline></video>
      <canvas id="debug"></canvas>
    </div>

    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

    <!-- App -->
    <script src="gesture.js"></script>
    <script src="shapes.js"></script>
    <script src="particles.js"></script>
    <script src="main.js"></script>
  </body>
</html>
